<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Anteriores - Baloto & Revancha</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffcc00;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .draw-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 5px solid #ffcc00;
        }
        .draw-card.revancha {
            border-left: 5px solid #ff3366;
        }
        .draw-card.jackpot {
            background: linear-gradient(135deg, #4a3b00, #1e1e1e);
            border: 2px solid #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }
        .jackpot-badge {
            background-color: #ffcc00;
            color: #000;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 5px;
            display: inline-block;
        }
        .draw-info {
            flex: 1;
        }
        .draw-type {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffcc00;
        }
        .draw-card.revancha .draw-type {
            color: #ff3366;
        }
        .draw-date {
            font-size: 0.9em;
            color: #aaaaaa;
            margin-bottom: 10px;
        }
        .balls-container {
            display: flex;
            gap: 10px;
        }
        .ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ffcc00;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
        }
        .draw-card.revancha .ball {
            background-color: #ff3366;
            color: #fff;
        }
        .super-ball {
            background-color: #000;
            color: #fff;
            border: 2px solid #ffcc00;
        }
        .draw-card.revancha .super-ball {
            border: 2px solid #ff3366;
        }
        .back-button {
            display: block;
            width: 200px;
            margin: 20px auto;
            text-align: center;
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resultados Anteriores</h1>
        
        {% for draw in history %}
            <div class="draw-card {{ 'revancha' if draw.type == 'Revancha' else 'baloto' }} {{ 'jackpot' if draw.jackpot_won else '' }}">
                <div class="draw-info">
                    {% if draw.jackpot_won %}
                        <div class="jackpot-badge">⭐ ¡CAYÓ LA LOTERÍA! ⭐</div>
                    {% endif %}
                    <div class="draw-type">{{ draw.type }}</div>
                    <div class="draw-date">{{ draw.date if draw.date else 'Fecha Desconocida' }}</div>
                </div>
                <div class="balls-container">
                    {% for ball in draw.main_balls %}
                        <div class="ball">{{ ball }}</div>
                    {% endfor %}
                    <div class="ball super-ball">{{ draw.super_ball }}</div>
                </div>
            </div>
        {% endfor %}

        <a href="/" class="back-button">Volver al Inicio</a>
    </div>
</body>
</html>
